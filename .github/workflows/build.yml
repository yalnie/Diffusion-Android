name: Build
on: [push, pull_request]
permissions:
  contents: write
  actions: read
jobs:
  build:
    name: build-linux
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Fetch dependencies
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git clone https://github.com/Aynekko/Diffusion-MainUI 3rd-party/mainui_cpp
        git clone https://github.com/Aynekko/Diffusion-executable 3rd-party/game_launch
        git clone --depth 1 https://github.com/EmbarkStudios/physx-rs 3rd-party/physx-rs
        git -C 3rd-party/physx-rs fetch --depth 1 origin 6b3a94534016270f8f6ebc665cd97ba7ce858d84
        git -C 3rd-party/physx-rs checkout 6b3a94534016270f8f6ebc665cd97ba7ce858d84
        if [ ! -f 3rd-party/physx-rs/physx-sys/PhysX/physx/include/PxPhysicsAPI.h ]; then
          git -C 3rd-party/physx-rs submodule update --init --depth 1 physx-sys/PhysX
        fi
        ln -s physx-rs/physx-sys/PhysX 3rd-party/physx
        assets=$(gh release view continuous -R FWGS/xash3d-fwgs --json assets --jq '.assets[].name')
        echo "FWGS continuous release assets:"
        echo "$assets"
        engine_asset=$(echo "$assets" | grep -iE '(amd64|x86_64).*\.AppImage$' | head -1 || true)
        if [ -n "$engine_asset" ]; then
          echo "Using engine asset: $engine_asset"
          gh release download continuous -R FWGS/xash3d-fwgs --pattern "$engine_asset" --output xash3d-fwgs-amd64.AppImage
          gh release download continuous -R AppImage/appimagetool --pattern 'appimagetool-x86_64.AppImage' --output appimagetool-x86_64.AppImage
          gh release download continuous -R AppImage/type2-runtime --pattern 'runtime-x86_64' --output runtime-x86_64
          chmod +x *.AppImage
        else
          echo "::warning::FWGS continuous release currently has no Linux amd64 AppImage, the release will contain the game libraries only"
        fi
    - name: Build for Linux
      run: |
        ./waf configure -T release install --destdir=out
        # Strip all game libraries (removes debug symbols)
        find out -type f \( -name '*.so' -o -name 'diffusion_run' -o -name 'xash*' \) -print -exec strip --strip-all {} \;
        # Show sizes
        find out -type f \( -name '*.so' -o -name 'diffusion_run' \) -exec ls -lh {} \;
        # Copy shaders into the release
        cp -a glsl out/diffusion/
        pushd out
        zip -r ../diffusion-linux-amd64.zip diffusion
        popd
    # wow this is much more horrible than I expected
    - name: Repackage engine
      run: |
        if [ ! -f xash3d-fwgs-amd64.AppImage ]; then
          echo "Engine AppImage unavailable, skipping repackage"
          exit 0
        fi
        ./xash3d-fwgs-amd64.AppImage --appimage-extract
        pushd squashfs-root
        rm -rf libav* libsw* libref_soft.so libmenu* xash3d
        rm -rf mdldec activities.txt
        rm -rf xash3d-fwgs.desktop xash3d-fwgs.png .DirIcon valve
        cp ../out/diffusion_run .
        cp ../scripts/diffusion.desktop .
        cp ../scripts/AppRun .
        cp ../3rd-party/game_launch/game_icon.png diffusion.png
        popd
        chmod -R a+rX squashfs-root
        chmod a+rx squashfs-root/AppRun
        ./appimagetool-x86_64.AppImage --runtime-file runtime-x86_64 squashfs-root/
        zip -u diffusion-linux-amd64.zip Diffusion-x86_64.AppImage
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        path: diffusion-linux-amd64.zip
        archive: false

  build-win64:
    runs-on: windows-2022
    continue-on-error: true
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Fetch PhysX SDK
      shell: bash
      run: |
        git clone --depth 1 https://github.com/EmbarkStudios/physx-rs 3rd-party/physx-rs
        git -C 3rd-party/physx-rs fetch --depth 1 origin 6b3a94534016270f8f6ebc665cd97ba7ce858d84
        git -C 3rd-party/physx-rs checkout 6b3a94534016270f8f6ebc665cd97ba7ce858d84
        if [ ! -f 3rd-party/physx-rs/physx-sys/PhysX/physx/include/PxPhysicsAPI.h ]; then
          git -C 3rd-party/physx-rs submodule update --init --depth 1 physx-sys/PhysX
        fi
        cp -r 3rd-party/physx-rs/physx-sys/PhysX 3rd-party/physx
    - name: Build for Windows x64
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" x64
        python scripts\build_physx_msvc.py x64
        if errorlevel 1 exit /b 1
        msbuild server\server.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:PostBuildEventUseInBuild=false /p:DebugType=None /p:DebugInformationFormat=None
        if errorlevel 1 exit /b 1
        msbuild client\client.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:PostBuildEventUseInBuild=false /p:DebugType=None /p:DebugInformationFormat=None
        if errorlevel 1 exit /b 1
    - name: Fetch menu source
      shell: bash
      run: |
        git clone https://github.com/Aynekko/Diffusion-MainUI 3rd-party/mainui_cpp
    - name: Build menu for Windows x64
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" x64
        msbuild 3rd-party\mainui_cpp\menu.vcxproj /m ^
          /p:Configuration=Release ^
          /p:Platform=x64 ^
          /p:PlatformToolset=v143 ^
          /p:PostBuildEventUseInBuild=false ^
          /p:Optimization=MaxSpeed ^
          /p:DebugInformationFormat=None ^
          /p:GenerateDebugInformation=false
        if errorlevel 1 exit /b 1
    - name: Package
      shell: bash
      run: |
        mkdir -p out/diffusion/bin
        cp x64/Release/server/server_amd64.dll out/diffusion/bin/
        cp x64/Release/client/client_amd64.dll out/diffusion/bin/
        cp 3rd-party/mainui_cpp/x64/Release/menu.dll out/diffusion/bin/menu_amd64.dll
        # Copy shaders into the release
        cp -a glsl out/diffusion/
        cd out
        7z a ../diffusion-win64.zip diffusion
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        path: diffusion-win64.zip
        archive: false

  build-android:
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r30
        add-to-path: true

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build

    - name: Cache Xash3D engine libraries
      id: engine-cache
      uses: actions/cache@v4
      with:
        path: build/engine_prebuilts
        key: xash-engine-${{ runner.os }}-v1-${{ hashFiles('scripts/build_engine_native.sh') }}

    - name: Fetch dependencies
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git clone https://github.com/yalnie/Diffusion-Android-MainUI 3rd-party/mainui_cpp || git clone https://github.com/Aynekko/Diffusion-MainUI 3rd-party/mainui_cpp
        git clone https://github.com/Aynekko/Diffusion-executable 3rd-party/game_launch
        bash scripts/setup_physx.sh
        bash scripts/setup_xash_extras.sh

    - name: Build native Android libraries
      env:
        ANDROID_API_LEVEL: 21
      run: |
        bash scripts/build_android_native.sh all

    - name: Setup Xash3D engine libraries
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        bash scripts/setup_engine_libs.sh

    - name: Preload Gradle distribution
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        bash scripts/preload_gradle.sh

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    - name: Prepare APK artifact
      run: |
        mkdir -p artifacts
        cp android/app/build/outputs/apk/release/*.apk artifacts/diffusion-android.apk 2>/dev/null || \
        cp android/app/build/outputs/apk/*/*/*.apk artifacts/diffusion-android.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v7
      with:
        path: artifacts/diffusion-android.apk
        archive: false

  release:
    name: "Upload to releases"
    runs-on: ubuntu-latest
    needs: [build, build-win64, build-android]
    if: ${{ github.event_name == 'push' }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Remove old release, fetch artifacts, repackage binaries and upload new release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        bash scripts/gha/make_release.sh "Diffusion" "${{ github.ref_name }}"
